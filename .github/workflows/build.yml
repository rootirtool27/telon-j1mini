name: AI Auto-Compiler Build

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: telon-gsm-sip-gateway

      - name: Clone Libraries
        run: |
          cd telon-gsm-sip-gateway
          git clone https://github.com/telon-org/react-native-tele.git
          git clone https://github.com/telon-org/react-native-sip2.git
          git clone https://github.com/telon-org/react-native-replace-dialer.git

      - name: Setup Environment (Java 17 & Node 18)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      
      - name: Install Android Tools
        uses: android-actions/setup-android@v3

      - name: Prepare JS Dependencies
        run: |
          # Фикс кривого JSON в библиотеках
          echo '{"name": "react-native-sip2","version": "1.0.0","main": "index.js"}' > ./telon-gsm-sip-gateway/react-native-sip2/package.json
          cd telon-gsm-sip-gateway/telon-gateway-app
          yarn install --no-lockfile

      - name: AI Magic: Run Script or Fix Gradle
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app
        run: |
          # 1. Ищем ЛЮБОЙ скрипт запуска (run.sh, build.sh, gradlew)
          TARGET_SCRIPT=$(find . -name "run.sh" -o -name "build.sh" | head -n 1)
          
          if [ -n "$TARGET_SCRIPT" ]; then
            echo "🤖 ИИ нашел скрипт: $TARGET_SCRIPT. Запускаю..."
            chmod +x "$TARGET_SCRIPT"
            ./$TARGET_SCRIPT
          else
            echo "🤖 Скрипт не найден. Включаю режим 'Ручной починки'..."
            cd android
            # Убиваем рекурсию (StackOverflow)
            echo "rootProject.name = 'telon-gateway-app'" > settings.gradle
            echo "include ':app'" >> settings.gradle
            
            # Подставляем пути к Maven вручную, чтобы Java увидела React Native
            sed -i '/repositories {/a \        maven { url "$rootDir/../node_modules/react-native/android" }\n        maven { url "$rootDir/../node_modules/jsc-android/dist" }' build.gradle
            
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon -Pandroid.suppressUnsupportedCompileSdk=34
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: telon-gsm-sip-gateway/telon-gateway-app/android/app/build/outputs/apk/debug/*.apk
          
