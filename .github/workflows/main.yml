name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: telon-gsm-sip-gateway

      - name: Clone Required Libraries
        run: |
          cd telon-gsm-sip-gateway
          git clone https://github.com/telon-org/react-native-tele.git
          git clone https://github.com/telon-org/react-native-sip2.git
          git clone https://github.com/telon-org/react-native-replace-dialer.git

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: sdkmanager "build-tools;30.0.3" "platforms;android-34"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Hard Reset Configs
        run: |
          # Стерилизуем sip2 еще раз
          echo '{"name": "react-native-sip2","version": "1.0.0","main": "index.js"}' > ./telon-gsm-sip-gateway/react-native-sip2/package.json
          
          cd telon-gsm-sip-gateway/telon-gateway-app
          # Полностью пересоздаем зависимости, чтобы исключить старые хвосты
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete pkg.dependencies['react-native-tele'];
          delete pkg.dependencies['react-native-sip2'];
          delete pkg.dependencies['react-native-replace-dialer'];
          pkg.dependencies['react-native-tele'] = 'file:../react-native-tele';
          pkg.dependencies['react-native-sip2'] = 'file:../react-native-sip2';
          pkg.dependencies['react-native-replace-dialer'] = 'file:../react-native-replace-dialer';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Install Dependencies
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app
        run: yarn install --no-lockfile

      - name: Make Gradlew Executable
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app/android
        run: chmod +x gradlew

      - name: Build Debug APK (Debug Mode)
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app/android
        env:
          _JAVA_OPTIONS: "-Xmx4g -Xss20m"
        run: |
          # --no-daemon и --stacktrace помогут увидеть корень зла, если снова упадет
          # --max-workers=1 запретит Gradle распараллеливать задачи (иногда это лечит StackOverflow)
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --max-workers=1 \
            -Pandroid.suppressUnsupportedCompileSdk=34 \
            -x lint
            
