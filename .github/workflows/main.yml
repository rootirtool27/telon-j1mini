name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Node Modules
        # Мы заходим в папку проекта перед установкой
        run: cd telon-gateway-app && npm install --legacy-peer-deps

      - name: Grant execute permission for gradlew
        run: chmod +x telon-gateway-app/android/gradlew

      - name: Build with Gradle
        # Переходим в android и запускаем сборку
        run: |
          cd telon-gateway-app/android
          ./gradlew assembleDebug --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: telon-gateway-app/android/app/build/outputs/apk/debug/app-debug.apk
