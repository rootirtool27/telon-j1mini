name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: telon-gsm-sip-gateway

      - name: Clone Required Libraries
        run: |
          cd telon-gsm-sip-gateway
          git clone https://github.com/telon-org/react-native-tele.git
          git clone https://github.com/telon-org/react-native-sip2.git
          git clone https://github.com/telon-org/react-native-replace-dialer.git

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'zulu'
          cache: gradle

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Patch Package JSONs
        working-directory: ./telon-gsm-sip-gateway
        run: |
          # 1. ЖЕСТКОЕ ЛЕЧЕНИЕ JSON в sip2 через Node.js
          node -e "
          const fs = require('fs');
          const p = './react-native-sip2/package.json';
          try {
            let s = fs.readFileSync(p, 'utf8');
            // Удаляем невидимые символы, лишние запятые и мусор
            let clean = s.replace(/[\u0000-\u001F\u007F-\u009F]/g, '').replace(/,[ \t\r\n]*([}\]])/g, '\$1');
            fs.writeFileSync(p, JSON.stringify(JSON.parse(clean), null, 2));
            console.log('SIP2 JSON fixed and formatted!');
          } catch (e) {
            console.log('Error fixing JSON: ' + e.message);
          }"

          # 2. Подменяем пути в основном проекте
          cd telon-gateway-app
          sed -i 's|ssh://git@github.com/telon-org/react-native-tele.git|../react-native-tele|g' package.json
          sed -i 's|ssh://git@github.com/telon-org/react-native-sip2.git|../react-native-sip2|g' package.json
          sed -i 's|ssh://git@github.com/telon-org/react-native-replace-dialer.git|../react-native-replace-dialer|g' package.json

      - name: Install Dependencies
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app
        run: yarn install --no-lockfile

      - name: Make Gradlew Executable
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: telon-gsm-sip-gateway/telon-gateway-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
