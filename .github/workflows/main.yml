name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: telon-gsm-sip-gateway

      - name: Clone Required Libraries
        run: |
          cd telon-gsm-sip-gateway
          git clone https://github.com/telon-org/react-native-tele.git
          git clone https://github.com/telon-org/react-native-sip2.git
          git clone https://github.com/telon-org/react-native-replace-dialer.git

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Patch Package JSON
        run: |
          echo '{"name": "react-native-sip2","version": "1.0.0","main": "index.js"}' > ./telon-gsm-sip-gateway/react-native-sip2/package.json
          cd telon-gsm-sip-gateway/telon-gateway-app
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies['react-native-tele'] = 'file:../react-native-tele';
          pkg.dependencies['react-native-sip2'] = 'file:../react-native-sip2';
          pkg.dependencies['react-native-replace-dialer'] = 'file:../react-native-replace-dialer';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Install Dependencies
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app
        run: yarn install --no-lockfile

      - name: Dynamic Settings Patch
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app
        run: |
          # 1. Ищем файл и сохраняем его ПУТЬ в переменную
          # Если файлов несколько, берем первый попавшийся
          GRADLE_SCRIPT_PATH=$(find node_modules -name "native_modules.gradle" | head -n 1)
          
          if [ -z "$GRADLE_SCRIPT_PATH" ]; then
            echo "КРИТИЧЕСКАЯ ОШИБКА: native_modules.gradle не найден в node_modules!"
            ls -R node_modules/react-native | grep gradle || true
            exit 1
          fi
          
          echo "Нашел скрипт тут: $GRADLE_SCRIPT_PATH"
          
          # 2. Формируем settings.gradle динамически
          cd android
          echo "
          rootProject.name = 'telon-gateway-app'
          apply from: file(\"../$GRADLE_SCRIPT_PATH\"); 
          applyNativeModulesSettingsGradle(settings)
          include ':app'
          " > settings.gradle

      - name: Build Debug APK
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app/android
        env:
          _JAVA_OPTIONS: "-Xmx6g -Xss8m"
        run: |
          rm -rf .gradle build app/build
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pandroid.suppressUnsupportedCompileSdk=34
          
