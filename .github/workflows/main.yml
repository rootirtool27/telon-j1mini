name: Build Android APK

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: telon-gsm-sip-gateway

      - name: Clone Libs
        run: |
          cd telon-gsm-sip-gateway
          git clone https://github.com/telon-org/react-native-tele.git
          git clone https://github.com/telon-org/react-native-sip2.git
          git clone https://github.com/telon-org/react-native-replace-dialer.git

      - name: Java & SDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Android Setup
        uses: android-actions/setup-android@v3

      - name: Install Tools
        run: sdkmanager "build-tools;30.0.3" "platforms;android-34"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Fix SIP2 & JSON
        run: |
          echo '{"name": "react-native-sip2","version": "1.0.0","main": "index.js"}' > ./telon-gsm-sip-gateway/react-native-sip2/package.json
          cd telon-gsm-sip-gateway/telon-gateway-app
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies['react-native-tele'] = 'file:../react-native-tele';
          pkg.dependencies['react-native-sip2'] = 'file:../react-native-sip2';
          pkg.dependencies['react-native-replace-dialer'] = 'file:../react-native-replace-dialer';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Install deps
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app
        run: yarn install --no-lockfile

      - name: Surgical Android Patch
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app/android
        run: |
          # 1. Чистим settings.gradle (убираем всё, что вызывает циклы)
          echo "rootProject.name = 'telon-gateway-app'" > settings.gradle
          echo "include ':app'" >> settings.gradle
          
          # 2. Правим build.gradle (верхний уровень) - ЖЕСТКО задаем репозитории
          echo "
          allprojects {
              repositories {
                  mavenLocal()
                  maven { url \"\$rootDir/../node_modules/react-native/android\" }
                  maven { url \"\$rootDir/../node_modules/jsc-android/dist\" }
                  google()
                  mavenCentral()
              }
          }
          " > build.gradle

          # 3. Правим app/build.gradle - убираем динамику
          # Удаляем строку с implementation "com.facebook.react:react-native:+" если она там есть
          sed -i '/com.facebook.react:react-native/d' app/build.gradle
          # Вставляем ПРЯМУЮ зависимость на версию из node_modules
          sed -i '/dependencies {/a \    implementation "com.facebook.react:react-native:0.71.0-rc.0"' app/build.gradle

      - name: Final Build
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app/android
        env:
          _JAVA_OPTIONS: "-Xmx6g -Xss2m" # Уменьшаем стек! Если была рекурсия, он упадет СРАЗУ, и мы увидим ГДЕ.
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pandroid.suppressUnsupportedCompileSdk=34
          
