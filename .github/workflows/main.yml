name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: telon-gsm-sip-gateway

      - name: Clone Required Libraries
        run: |
          cd telon-gsm-sip-gateway
          git clone https://github.com/telon-org/react-native-tele.git
          git clone https://github.com/telon-org/react-native-sip2.git
          git clone https://github.com/telon-org/react-native-replace-dialer.git

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'zulu'
          cache: gradle

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Nuke and Rebuild Broken JSON
        run: |
          # Создаем чистый package.json для sip2 вручную, чтобы точно не было ошибок
          cat <<EOF > ./telon-gsm-sip-gateway/react-native-sip2/package.json
          {
            "name": "react-native-sip2",
            "version": "1.0.0",
            "main": "index.js",
            "dependencies": {}
          }
          EOF
          echo "Created fresh package.json for react-native-sip2"

      - name: Force Local Dependencies
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app
        run: |
          # Убираем всё лишнее и привязываем локальные папки
          sed -i '/react-native-tele/d' package.json
          sed -i '/react-native-sip2/d' package.json
          sed -i '/react-native-replace-dialer/d' package.json
          
          yarn add file:../react-native-tele file:../react-native-sip2 file:../react-native-replace-dialer --no-lockfile

      - name: Install All Dependencies
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app
        run: yarn install --no-lockfile

      - name: Make Gradlew Executable
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: telon-gsm-sip-gateway/telon-gateway-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
