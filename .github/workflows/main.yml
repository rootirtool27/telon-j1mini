name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: telon-gsm-sip-gateway

      - name: Clone Required Libraries
        run: |
          cd telon-gsm-sip-gateway
          git clone https://github.com/telon-org/react-native-tele.git
          git clone https://github.com/telon-org/react-native-sip2.git
          git clone https://github.com/telon-org/react-native-replace-dialer.git

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: sdkmanager "build-tools;30.0.3" "platforms;android-34"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Patch Package JSON
        run: |
          echo '{"name": "react-native-sip2","version": "1.0.0","main": "index.js"}' > ./telon-gsm-sip-gateway/react-native-sip2/package.json
          cd telon-gsm-sip-gateway/telon-gateway-app
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies['react-native-tele'] = 'file:../react-native-tele';
          pkg.dependencies['react-native-sip2'] = 'file:../react-native-sip2';
          pkg.dependencies['react-native-replace-dialer'] = 'file:../react-native-replace-dialer';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Install Dependencies
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app
        run: yarn install --no-lockfile

      - name: Nuclear Patch for Android
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app/android
        run: |
          # 1. Принудительно вставляем React Native в проект через settings.gradle
          echo "include ':react-native'" >> settings.gradle
          echo "project(':react-native').projectDir = new File(rootProject.projectDir, '../node_modules/react-native/android')" >> settings.gradle
          
          # 2. Прописываем мавен-путь в основной build.gradle
          sed -i '/allprojects {/a \    repositories {\n        maven { url "$rootDir/../node_modules/react-native/android" }\n    }' build.gradle
          
          # 3. Добавляем прямую зависимость в app/build.gradle
          sed -i '/dependencies {/a \    implementation project(":react-native")' app/build.gradle
          
          # 4. Фикс памяти для Gradle
          echo "org.gradle.jvmargs=-Xmx4g -Xss16m" >> gradle.properties

      - name: Build Debug APK
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app/android
        env:
          _JAVA_OPTIONS: "-Xmx6g -Xss64m"
        run: |
          rm -rf .gradle build app/build
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pandroid.suppressUnsupportedCompileSdk=34
          
