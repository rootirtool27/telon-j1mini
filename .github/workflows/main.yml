name: Build APK For J1 Mini
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          cd telon-gateway-app
          npm install --legacy-peer-deps
          echo "ПРОВЕРКА ФАЙЛОВ:"
          ls -d node_modules/@react-native-community/cli-platform-android && echo "ПАПКА НАЙДЕНА" || echo "ПАПКА ОТСУТСТВУЕТ"

      - name: Build with Gradle
        run: |
          cd telon-gateway-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pandroid.builder.sdkDownload=true
          
