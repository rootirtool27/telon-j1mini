name: Build Android APK
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Android SDK 31
        run: |
          # Принудительно находим sdkmanager через переменную окружения
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --update
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-31" "build-tools;30.0.3"

      - name: Install Dependencies
        run: |
          cd telon-gateway-app
          npm install --legacy-peer-deps

      - name: Build with Gradle
        run: |
          cd telon-gateway-app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          
