name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: telon-gsm-sip-gateway

      - name: Clone Required Libraries
        run: |
          cd telon-gsm-sip-gateway
          git clone https://github.com/telon-org/react-native-tele.git
          git clone https://github.com/telon-org/react-native-sip2.git
          git clone https://github.com/telon-org/react-native-replace-dialer.git

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'zulu'
          cache: gradle

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Force Local Dependencies
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app
        run: |
          # 1. Удаляем старые зависимости из package.json, чтобы Yarn не лез в интернет
          npm remove react-native-tele react-native-sip2 react-native-replace-dialer --package-lock-only || true
          
          # 2. Добавляем их как локальные пути (file:../)
          yarn add file:../react-native-tele file:../react-native-sip2 file:../react-native-replace-dialer --no-lockfile
          
          echo "Dependencies switched to LOCAL folders"

      - name: Install All Dependencies
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app
        run: yarn install --no-lockfile

      - name: Make Gradlew Executable
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: telon-gsm-sip-gateway/telon-gateway-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
