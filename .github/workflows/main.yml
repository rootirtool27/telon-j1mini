name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем основной репозиторий в подпапку
      - name: Checkout main repository
        uses: actions/checkout@v3
        with:
          path: telon-gsm-sip-gateway

      # 2. Клонируем зависимости РЯДОМ (как в инструкции)
      - name: Clone Required Libraries
        run: |
          git clone https://github.com/telon-org/react-native-tele.git
          git clone https://github.com/telon-org/react-native-sip2.git
          git clone https://github.com/telon-org/react-native-replace-dialer.git
        # Теперь структура: ./react-native-tele и ./telon-gsm-sip-gateway лежат в одном корне

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'zulu'
          cache: gradle

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Установка зависимостей в папке приложения
      - name: Install Dependencies
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app
        run: yarn install

      # 4. Даем права на запуск Gradle
      - name: Make Gradlew Executable
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app/android
        run: chmod +x gradlew

      # 5. Сама сборка
      - name: Build Debug APK
        working-directory: ./telon-gsm-sip-gateway/telon-gateway-app/android
        run: ./gradlew assembleDebug --no-daemon

      # 6. Сохраняем результат
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: telon-gsm-sip-gateway/telon-gateway-app/android/app/build/outputs/apk/debug/app-debug.apk
          
