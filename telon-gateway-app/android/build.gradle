buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.4.2")
    }
}

// ВОТ ЭТОТ БЛОК ЗАМЕНЯЕМ ПОЛНОСТЬЮ
allprojects {
    repositories {
        google()
        mavenCentral()

        // Прямой путь к папке android внутри node_modules
        maven {
            url file("${projectDir}/../../node_modules/react-native/android")
        }

        // Путь для Android-движка Hermes
        maven {
            url file("${projectDir}/../../node_modules/hermes-engine/android")
        }

        maven { url "https://jitpack.io" }
    }
}
