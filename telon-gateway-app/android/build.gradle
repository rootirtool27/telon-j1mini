buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.0.2")
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        
        // ВОТ ЭТО СПАСЕТ БИЛД:
        maven {
            // Указываем прямой путь к папке с андроидной частью react-native
            url("$rootDir/../node_modules/react-native/android")
        }
        
        maven { url 'https://www.jitpack.io' }
    }
}
