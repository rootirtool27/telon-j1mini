apply plugin: "com.android.application"

android {
    compileSdkVersion 31
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.telexample"
        minSdkVersion 21
        targetSdkVersion 31
        versionCode 1
        versionName "1.0"
        // Убираем лишние стратегии, оставляем базу
        missingDimensionStrategy 'store', 'play'
    }

    buildTypes {
        debug {
            // Главный фикс: заставляем искать 'release' в модулях, если 'debug' пустой
            matchingFallbacks = ['release', 'runtime', 'default']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // Игнорируем ошибки сборки, чтобы прорваться к 4000 строкам
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

// СЕКРЕТНЫЙ СОУС: Исправляем ошибку "None of the consumable configurations have attributes"
// Мы проходим по всем зависимостям и ПРИНУДИТЕЛЬНО ставим им тип 'debug'
configurations.all {
    resolutionStrategy {
        force "com.facebook.react:react-native:+"
    }
    attributes {
        attribute(Attribute.of('com.android.build.api.attributes.BuildTypeAttr', String), 'debug')
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "com.facebook.react:react-native:+"
    implementation "androidx.appcompat:appcompat:1.3.0"
    
    // Подключаем напрямую. Теперь благодаря блоку выше Gradle их "увидит"
    implementation project(':react-native-sip2')
    implementation project(':react-native-tele')
}

// Добиваем остатки node_modules
def nodeModulesPath = "../node_modules"
def nativeModulesFile = new File(rootProject.projectDir, "${nodeModulesPath}/@react-native-community/cli-platform-android/native_modules.gradle")
if (nativeModulesFile.exists()) {
    apply from: nativeModulesFile
    applyNativeModulesAppBuildGradle(project)
}
