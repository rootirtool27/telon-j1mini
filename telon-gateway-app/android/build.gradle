buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.4.2")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        
        // Это заставит Gradle искать файлы прямо в папках
        flatDir {
            dirs "${rootProject.projectDir}/../node_modules/react-native/android"
            dirs "${rootProject.projectDir}/../node_modules/hermes-engine/android"
        }
        
        maven { url "https://jitpack.io" }
    }
}
