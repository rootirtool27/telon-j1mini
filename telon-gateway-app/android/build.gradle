buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Для React Native 0.80 лучше использовать более свежий Gradle плагин
        classpath("com.android.tools.build:gradle:7.4.2")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}
