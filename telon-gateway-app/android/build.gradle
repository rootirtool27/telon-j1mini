buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Версия 7.4.2 отлично работает с Gradle 7.5.1
        classpath("com.android.tools.build:gradle:7.4.2")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        
        // Поиск локальных модулей
        maven {
            url "$rootDir/../node_modules/react-native/android"
        }
        
        maven { url 'https://www.jitpack.io' }
    }
}
