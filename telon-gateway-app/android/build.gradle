buildscript {
    ext {
        buildToolsVersion = "30.0.3"
        minSdkVersion = 21        // Android 5.1
        compileSdkVersion = 31    // Android 12
        targetSdkVersion = 31
        ndkVersion = "21.4.7075529"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Версия строго под Gradle 7.0.2
        classpath("com.android.tools.build:gradle:7.0.4")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Фикс для конфликтов библиотек (часто бывает на старых Android)
subprojects {
    project.configurations.all {
        resolutionStrategy.force 'androidx.core:core:1.6.0'
    }
}
