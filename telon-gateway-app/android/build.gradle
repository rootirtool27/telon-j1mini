buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Стабильная версия для Gradle 7.5.1
        classpath("com.android.tools.build:gradle:7.4.2")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()

        // ВАЖНО: Указываем путь к папке android внутри node_modules
        maven {
            url "$rootDir/../node_modules/react-native/android"
        }

        // Путь для Android-движка Hermes
        maven {
            url "$rootDir/../node_modules/hermes-engine/android"
        }

        maven { url "https://jitpack.io" }
    }
}
