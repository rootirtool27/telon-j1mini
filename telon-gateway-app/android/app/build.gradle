apply plugin: "com.android.application"

android {
    namespace "one.telefon.gateway" 
    compileSdkVersion 34
    
    defaultConfig {
        applicationId "one.telefon.gateway"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        missingDimensionStrategy 'store', 'play'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }
}

dependencies {
    // Теперь подключаем версию 0.80.0 официально через Maven-путь выше
    implementation "com.facebook.react:react-native:0.80.0"
    implementation "com.facebook.react:hermes-android"

    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.facebook.soloader:soloader:0.10.5"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
}

// Фикс для предотвращения StackOverflow и конфликтов версий
configurations.all {
    resolutionStrategy.force 'com.facebook.react:react-native:0.80.0'
}
