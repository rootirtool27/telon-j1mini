apply plugin: "com.android.application"

android {
    compileSdkVersion 31
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.telexample"
        minSdkVersion 21
        targetSdkVersion 31
        versionCode 1
        versionName "1.0"
        
        // Эта стратегия заставит Gradle не искать 'debug' в модулях, где его нет
        missingDimensionStrategy 'store', 'play'
    }

    // НОВЫЙ БЛОК: Решаем проблему "No matching configuration" на корню
    configurations.all {
        resolutionStrategy {
            dependencySubstitution {
                // Если Gradle тупит с типами сборок, это должно его успокоить
            }
        }
        attributes {
            // Удаляем требование конкретного типа сборки для зависимостей
            attribute(Attribute.of('com.android.build.api.attributes.BuildTypeAttr', String), 'debug')
        }
    }

    buildTypes {
        debug {
            // Подстраховка: если нет дебага, бери релиз
            matchingFallbacks = ['release', 'default']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "com.facebook.react:react-native:+"
    implementation "androidx.appcompat:appcompat:1.3.0"
    
    // Подключаем модули, используя базовую конфигурацию 'default'
    implementation project(path: ':react-native-sip2', configuration: 'default')
    implementation project(path: ':react-native-tele', configuration: 'default')
}

def nodeModulesPath = "../node_modules"
def nativeModulesFile = new File(rootProject.projectDir, "${nodeModulesPath}/@react-native-community/cli-platform-android/native_modules.gradle")

if (nativeModulesFile.exists()) {
    apply from: nativeModulesFile
    applyNativeModulesAppBuildGradle(project)
}
