apply plugin: "com.android.application"

android {
    namespace "one.telefon.gateway" 
    compileSdkVersion 34

    defaultConfig {
        applicationId "one.telefon.gateway"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    // Указываем, где лежат библиотеки, ОДИН РАЗ
    repositories {
        flatDir {
            dirs "../../node_modules/react-native/android", 
                 "../../node_modules/hermes-engine/android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // Подключаем библиотеки по именам (как они лежат в папках)
    implementation name: 'react-native-0.71.0-rc.0', ext: 'aar'
    implementation name: 'hermes-engine-0.71.0-rc.0', ext: 'aar'

    // Необходимые "мозги" для библиотек
    implementation "com.facebook.infer.annotation:infer-annotation:0.18.0"
    implementation "javax.inject:javax.inject:1"
    implementation "com.facebook.soloader:soloader:0.10.5"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
}
