apply plugin: "com.android.application"

android {
    compileSdkVersion 34 // Для версии 0.80 лучше поднять до 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.telexample"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        missingDimensionStrategy 'store', 'play'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    
    // ЯВНО УКАЗЫВАЕМ ТВОЮ ВЕРСИЮ ИЗ package.json
    implementation "com.facebook.react:react-native:0.80.0"
    
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.facebook.react:hermes-android" // В 0.80 это стандарт
}

// Авто-подключение модулей
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); 
applyNativeModulesAppBuildGradle(project)
