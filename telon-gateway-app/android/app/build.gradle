apply plugin: "com.android.application"

android {
    namespace "one.telefon.gateway" 
    compileSdkVersion 34

    defaultConfig {
        applicationId "one.telefon.gateway"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        missingDimensionStrategy 'store', 'play'
    }

    // Это "черный ход" для компилятора Java
    repositories {
        flatDir {
            dirs "../../node_modules/react-native/android", 
                 "../../node_modules/hermes-engine/android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }
}

dependencies {
    // 1. Подключаем сами файлы .aar напрямую из папок
    implementation fileTree(dir: "../../node_modules/react-native/android", include: ["*.aar"])
    implementation fileTree(dir: "../../node_modules/hermes-engine/android", include: ["*.aar"])

    // 2. Вручную добавляем то, что обычно тянется "автоматом"
    // Без этих строк будет ошибка "package com.facebook.react does not exist"
    implementation "com.facebook.infer.annotation:infer-annotation:0.18.0"
    implementation "javax.inject:javax.inject:1"
    implementation "com.facebook.soloader:soloader:0.10.5"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
}
