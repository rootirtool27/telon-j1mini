apply plugin: "com.android.application"

android {
    compileSdkVersion 31
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.telexample"
        minSdkVersion 21
        targetSdkVersion 31
        versionCode 1
        versionName "1.0"

        // Эта строчка поможет модулям найти друг друга
        missingDimensionStrategy 'store', 'play'
    }

    buildTypes {
        debug {
            // ЭТО ГЛАВНОЕ ЛЕКАРСТВО:
            matchingFallbacks = ['release', 'debug']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // Помогаем Gradle не путаться в версиях библиотек
    configurations.all {
        resolutionStrategy {
            force "com.facebook.react:react-native:+"
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "com.facebook.react:react-native:+"
    implementation "androidx.appcompat:appcompat:1.3.0"
    
    // Подключаем твои модули
    implementation project(':react-native-sip2')
    implementation project(':react-native-tele')
}

// Авто-подключение остальных модулей
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
