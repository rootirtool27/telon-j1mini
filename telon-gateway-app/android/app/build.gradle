apply plugin: "com.android.application"

android {
    compileSdkVersion 31
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.telexample"
        minSdkVersion 21
        targetSdkVersion 31
        versionCode 1
        versionName "1.0"
        
        // Указываем стратегию, чтобы Грейдл не терялся в версиях
        missingDimensionStrategy 'store', 'play'
    }

    buildTypes {
        debug {
            // Если нет дебага в модулях, берем релиз или дефолт
            matchingFallbacks = ['release', 'default']
        }
    }
}

dependencies {
    implementation "com.facebook.react:react-native:+"
    implementation "androidx.appcompat:appcompat:1.3.0"
    
    // ВНИМАНИЕ: Подключаем через 'default' конфигурацию. 
    // Это самый простой способ прорваться сквозь атрибуты.
    implementation project(path: ':react-native-sip2', configuration: 'default')
    implementation project(path: ':react-native-tele', configuration: 'default')
}
