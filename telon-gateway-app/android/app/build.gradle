apply plugin: "com.android.application"

android {
    compileSdkVersion 31
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.telexample"
        minSdkVersion 21
        targetSdkVersion 31
        versionCode 1
        versionName "1.0"
        
        // Помогает модулям разобраться с версиями
        missingDimensionStrategy 'store', 'play'
    }

    buildTypes {
        debug {
            // Если в модуле нет дебага, берем релизную сборку
            matchingFallbacks = ['release']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "com.facebook.react:react-native:+"
    implementation "androidx.appcompat:appcompat:1.3.0"
    
    // Подключаем модули, принудительно указывая конфигурацию по умолчанию
    implementation project(path: ':react-native-sip2', configuration: 'default')
    implementation project(path: ':react-native-tele', configuration: 'default')
}

// Авто-подключение остальных модулей
def nodeModulesPath = "../node_modules"
def nativeModulesFile = new File(rootProject.projectDir, "${nodeModulesPath}/@react-native-community/cli-platform-android/native_modules.gradle")

if (nativeModulesFile.exists()) {
    apply from: nativeModulesFile
    applyNativeModulesAppBuildGradle(project)
}
