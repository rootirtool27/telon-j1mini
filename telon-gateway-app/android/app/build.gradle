apply plugin: "com.android.application"

android {
    namespace "com.telexample"
    compileSdkVersion 34
    
    defaultConfig {
        applicationId "com.telexample"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    // Берем локальные файлы из node_modules
    implementation fileTree(dir: "../../node_modules/react-native/android", include: ["*.aar"])
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.facebook.soloader:soloader:0.10.5"
}
