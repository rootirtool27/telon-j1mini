apply plugin: "com.android.application"

android {
    namespace "one.telefon.gateway" 
    compileSdkVersion 34

    defaultConfig {
        applicationId "one.telefon.gateway"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        missingDimensionStrategy 'store', 'play'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // Используем абсолютный путь через rootDir — это 100% сработает в GitHub Actions
    def nodeModules = "${rootProject.projectDir}/../node_modules"

    implementation fileTree(dir: "${nodeModules}/react-native/android", include: ["**/*.aar"])
    implementation fileTree(dir: "${nodeModules}/hermes-engine/android", include: ["**/*.aar"])

    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.facebook.soloader:soloader:0.10.5"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
}
