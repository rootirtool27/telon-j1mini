apply plugin: "com.android.application"

android {
    compileSdkVersion 31
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.telexample"
        minSdkVersion 21
        targetSdkVersion 31
        versionCode 1
        versionName "1.0"
        
        // Это важно для модулей
        missingDimensionStrategy 'store', 'play'
    }

    buildTypes {
        debug {
            // Теперь мы даем ТРИ варианта на случай, если модуль вредничает
            matchingFallbacks = ['release', 'runtime', 'default']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// ЭТОТ БЛОК — СЕКРЕТНЫЙ ИНГРЕДИЕНТ
// Он заставляет Gradle проглатывать модули без атрибутов
configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == "com.telexample") { // твой ID
             // здесь можно принудительно менять версии, но мы оставим это как триггер стабильности
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "com.facebook.react:react-native:+"
    implementation "androidx.appcompat:appcompat:1.3.0"
    
    // ПИШЕМ ТАК: без всяких конфигураций, просто и чисто
    implementation project(':react-native-sip2')
    implementation project(':react-native-tele')
}

def nodeModulesPath = "../node_modules"
def nativeModulesFile = new File(rootProject.projectDir, "${nodeModulesPath}/@react-native-community/cli-platform-android/native_modules.gradle")

if (nativeModulesFile.exists()) {
    apply from: nativeModulesFile
    applyNativeModulesAppBuildGradle(project)
}
