apply plugin: "com.android.application"

android {
    compileSdkVersion 31
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.telexample"
        minSdkVersion 21
        targetSdkVersion 31
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        pickFirst "lib/armeabi-v7a/libc++_shared.so"
        pickFirst "lib/arm64-v8a/libc++_shared.so"
        pickFirst "lib/x86/libc++_shared.so"
        pickFirst "lib/x86_64/libc++_shared.so"
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "com.facebook.react:react-native:+"
    implementation "androidx.appcompat:appcompat:1.3.0"
    implementation "com.google.android.material:material:1.4.0"
    
    // Подключаем модули (имена из settings.gradle)
    implementation project(':react-native-sip2')
    implementation project(':react-native-tele')
}

// Безопасное подключение скриптов (не упадет, если файла нет)
def nodeModules = "../../node_modules"
def reactGradle = new File(rootProject.projectDir, "${nodeModules}/react-native/react.gradle")
if (reactGradle.exists()) {
    apply from: reactGradle
}

def nativeModulesFile = new File(rootProject.projectDir, "${nodeModules}/@react-native-community/cli-platform-android/native_modules.gradle")
if (nativeModulesFile.exists()) {
    apply from: nativeModulesFile
    applyNativeModulesAppBuildGradle(project)
}
