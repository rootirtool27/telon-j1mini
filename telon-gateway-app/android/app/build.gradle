apply plugin: "com.android.application"

android {
    // Должно совпадать с тем, что мы писали в Манифесте
    namespace "one.telefon.gateway" 
    compileSdkVersion 34

    defaultConfig {
        applicationId "one.telefon.gateway"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        // Нужно для работы твоих модулей SIP и Tele
        missingDimensionStrategy 'store', 'play'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }
}

dependencies {
    // ВАЖНО: Мы пишем "+", чтобы Gradle сам взял ту версию, 
    // которую найдет в node_modules по путям из внешнего файла
    implementation "com.facebook.react:react-native:+"
    implementation "com.facebook.react:hermes-android:+"

    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.facebook.soloader:soloader:0.10.5"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
}

// ВНИМАНИЕ: Если здесь внизу был блок configurations.all { ... }, 
// мы его УДАЛИЛИ, чтобы не было ошибки StackOverflow.
