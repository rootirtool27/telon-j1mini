apply plugin: "com.android.application"

android {
    namespace "one.telefon.gateway" 
    compileSdkVersion 34

    defaultConfig {
        applicationId "one.telefon.gateway"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // 1. Подключаем ВСЁ из папок, не называя имен файлов (так мы не ошибемся в версии)
    implementation fileTree(dir: "../../node_modules/react-native/android", include: ["**/*.aar"])
    implementation fileTree(dir: "../../node_modules/hermes-engine/android", include: ["**/*.aar"])

    // 2. Жизненно важные органы React Native
    implementation "com.facebook.infer.annotation:infer-annotation:0.18.0"
    implementation "javax.inject:javax.inject:1"
    implementation "com.facebook.soloader:soloader:0.10.5"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    
    // 3. Добавляем OkHttp (React Native без него не живет)
    implementation "com.squareup.okhttp3:okhttp:4.9.2"
    implementation "com.squareup.okhttp3:okhttp-urlconnection:4.9.2"
    implementation "com.squareup.okio:okio:2.9.0"
}
