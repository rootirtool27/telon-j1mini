apply plugin: "com.android.application"

android {
    namespace "com.telexample" // Добавили обязательный namespace для Gradle 7.5+
    compileSdkVersion 34
    
    defaultConfig {
        applicationId "com.telexample"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        missingDimensionStrategy 'store', 'play'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "com.facebook.react:react-native:0.80.0"
    implementation "com.facebook.react:hermes-android"
}

// Умный поиск для app/build.gradle
def nodeModulesPath = "../../node_modules"
def nativeModulesFile = new File(rootProject.projectDir, "${nodeModulesPath}/@react-native-community/cli-platform-android/native_modules.gradle")

if (!nativeModulesFile.exists()) {
    nativeModulesFile = new File(rootProject.projectDir, "${nodeModulesPath}/react-native/gradle/native_modules.gradle")
}

if (nativeModulesFile.exists()) {
    apply from: nativeModulesFile
    applyNativeModulesAppBuildGradle(project)
}
